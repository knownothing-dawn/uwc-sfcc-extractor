name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate skill entry point
        run: |
          python -c "from pathlib import Path; p=Path('SKILL.md'); t=p.read_text(encoding='utf-8'); assert t.startswith('---\n') and 'name: uwc-sfcc-extractor' in t and 'description:' in t"

      - name: Run public test suite
        run: python -m unittest discover -s tests -v
