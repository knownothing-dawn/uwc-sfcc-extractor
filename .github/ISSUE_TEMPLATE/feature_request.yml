name: Feature request
description: Propose a general, evidence-backed improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: General problem
      description: Explain the reusable failure mode, not only one paper-specific correction.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and synthetic example
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Compatibility and scientific risks
      description: Include possible effects on schemas, gates, existing curves and output formats.
